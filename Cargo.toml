[package]
name = "auris"
version = "0.1.0"
edition = "2024"
description = "Command-line speech-to-text with Parakeet TDT 0.6B v2, transcribing audio from stdin"
license = "GPL-3.0-or-later"
repository = "https://github.com/simonspoon/auris"
readme = "README.md"
keywords = ["stt", "speech-to-text", "parakeet", "cli", "onnx"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
hound = "3.5.1"
rubato = "5.0.0"
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = "=1.13.6"
ureq = { version = "2.12", features = ["proxy-from-env"] }

[dev-dependencies]
tempfile = "3"
libc = "0.2"
