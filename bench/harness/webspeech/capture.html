<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>auris webspeech capture</title>
</head>
<body>
<!--
  Capture page for a Web Speech baseline against the bench/corpus fixtures.

  Driven by capture.py over CDP -- this page never runs unattended. For each
  utterance the driver calls window.__wsStartUtterance(id), plays the
  utterance's WAV into the system default audio input (see README.md for why
  that has to be an OS-level loopback, not getUserMedia's fake device), then
  polls window.__wsFinal until the audio has had time to finish and the
  recognizer has had time to settle.

  Two recognizers run in this one page, on purpose:

    1. webkitSpeechRecognition -- the thing actually being measured.
    2. A WebAudio RMS meter on getUserMedia -- a diagnostic, not the
       measurement. It exists because Chrome's speech recognizer opens the
       system default input directly and does NOT go through getUserMedia's
       media-stream pipeline (see README.md finding 2). Without this meter
       running in the SAME session, a silent loopback and a genuinely failed
       recognition look identical from outside: both are "no results." The
       meter lets capture.py tell those apart and abort loudly instead of
       silently scoring a mis-wired loopback as 30 ASR failures.
-->
<p>auris webspeech capture -- driven by capture.py, not for interactive use.</p>
<script>
window.__wsReady = false;
window.__wsFinal = [];
window.__wsInterim = "";
window.__wsError = null;
window.__wsStarted = false;
window.__wsEnded = false;
window.__micRMS = 0;
window.__wsCurrentId = null;
window.__wsStaleResultCount = 0;

let recognition = null;
// Bumped every time a fresh recognizer is built for a new utterance. Each
// recognizer's handlers close over the generation they were built under and
// refuse to touch window.__ws* state once a newer generation exists -- see
// __wsStartUtterance below for why this is the actual fix, not the previous
// timing-based one.
let recognitionGeneration = 0;

function buildRecognition(myGeneration) {
  const SpeechRecognition = window.webkitSpeechRecognition || window.SpeechRecognition;
  const rec = new SpeechRecognition();
  rec.continuous = true;
  rec.interimResults = true;
  rec.lang = "en-US";

  rec.onstart = () => {
    if (myGeneration !== recognitionGeneration) return; // discarded instance
    window.__wsStarted = true;
    window.__wsEnded = false;
  };

  rec.onresult = (event) => {
    if (myGeneration !== recognitionGeneration) {
      // A discarded recognizer's late result -- exactly the mechanism that
      // let utterance N's leftover text bleed into utterance N+1's row
      // (window.__wsFinal is now generation-guarded so this can never write
      // into the current utterance's results). Counted, not silently
      // dropped, so capture.py can report how often it happened.
      window.__wsStaleResultCount++;
      return;
    }
    let interim = "";
    for (let i = event.resultIndex; i < event.results.length; i++) {
      const transcript = event.results[i][0].transcript;
      if (event.results[i].isFinal) {
        window.__wsFinal.push(transcript);
      } else {
        interim += transcript;
      }
    }
    window.__wsInterim = interim;
  };

  rec.onerror = (event) => {
    if (myGeneration !== recognitionGeneration) return;
    window.__wsError = event.error;
  };

  rec.onend = () => {
    if (myGeneration !== recognitionGeneration) return; // discarded instance
    window.__wsEnded = true;
  };

  return rec;
}

// Called by capture.py right after an utterance's playback ends, before it
// reads window.__wsFinal. Chrome does not finalize a pending result on its
// own with continuous=true unless it independently decides speech ended --
// recognition.stop() is what forces the audio captured so far to be
// returned as a final onresult event.
window.__wsStop = function () {
  try {
    if (recognition) recognition.stop();
  } catch (e) {
    // ignore -- may already be stopped
  }
};

// Called by capture.py at the START of every utterance, including the
// first. Builds and starts a brand-new SpeechRecognition object rather than
// reusing/reset()-ing the previous one: reusing one long-lived recognizer
// across utterances is what let a late finalization from utterance N land in
// the results array utterance N+1 was reading (onend does not reliably fire
// at all -- see docs/README's finding on stop() unreliability -- so no
// timing margin can be trusted to catch it in time). Discarding the old
// recognizer outright, with its handlers generation-guarded above, makes
// that bleed structurally impossible: a stale instance's late final has
// nowhere to land no matter when or whether it arrives.
window.__wsStartUtterance = function (utteranceId) {
  if (recognition) {
    try { recognition.abort(); } catch (e) {}
  }
  recognitionGeneration++;
  window.__wsCurrentId = utteranceId;
  window.__wsFinal = [];
  window.__wsInterim = "";
  window.__wsError = null;
  window.__wsStarted = false;
  window.__wsEnded = false;
  // The mic RMS meter (startMicMeter below) is a running max that never
  // resets itself -- __wsReset() used to zero it every utterance; that reset
  // was dropped when this function replaced __wsReset() and needs to be
  // done here instead, or every utterance's RMS reading is just the loudest
  // peak seen since the page loaded, not this utterance's own peak.
  window.__micRMS = 0;
  recognition = buildRecognition(recognitionGeneration);
  recognition.start();
};

// Diagnostic meter: reads getUserMedia's own stream, independent of
// whatever webkitSpeechRecognition is hearing. See the file header comment
// for why this has to run in the same session as the recognizer above.
async function startMicMeter() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  const source = audioCtx.createMediaStreamSource(stream);
  const analyser = audioCtx.createAnalyser();
  analyser.fftSize = 2048;
  source.connect(analyser);
  const buffer = new Float32Array(analyser.fftSize);

  function tick() {
    analyser.getFloatTimeDomainData(buffer);
    let peak = 0;
    for (let i = 0; i < buffer.length; i++) {
      peak = Math.max(peak, Math.abs(buffer[i]));
    }
    window.__micRMS = Math.max(window.__micRMS, peak);
    requestAnimationFrame(tick);
  }
  tick();
}

// No recognition is started here -- capture.py calls window.__wsStartUtterance(id)
// for every utterance, including the first, once window.__wsReady is true.
startMicMeter()
  .then(() => { window.__wsReady = true; })
  .catch((e) => { window.__wsError = "mic-meter: " + e.message; window.__wsReady = true; });
</script>
</body>
</html>
